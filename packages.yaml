# Configuration for `integration-dashboard run`
# (https://github.com/OpenAstronomy/integration-dashboard).
#
# Every entry under `packages` is installed into one shared venv per
# column and tested with `pytest --pyargs <module>`. A package that would
# need an older version of a dependency than another listed package gets
# is reported as held back instead of being installed.
#
# `columns` is the flat list of test configurations to run; each is a
# (python, variant) pair and becomes one dashboard column. Python
# version and variant are independent -- list whatever combinations
# you want. Use uv's notation for Python, so e.g. "3.14t" for the
# free-threaded build. Variants:
#   stable -- each package at its latest release
#   pre    -- same, but including pre-releases
#   dev    -- each package from a nightly wheel in `dev_index_urls` if
#             one exists, otherwise from git HEAD
#
# `tier` (on each package) is purely a category label used for
# ordering and the optional `--tiers` CLI filter. Tiers are installed
# and displayed in the order they first appear in this file, so keep
# each tier's packages together. This file uses `coordinated`,
# `affiliated` and `provisional`.

# pytest plugins added to every venv alongside pytest itself.
# pytest-remotedata registers the `remote_data` marker that many packages
# use; with the plugin installed but `--remote-data` not passed, those
# tests are skipped instead of running and timing out on network calls.
test_deps: [pytest-remotedata]

# Nightly wheel indexes used by `dev` columns, for any package they host
# (liberfa hosts pyerfa's dev wheels).
dev_index_urls:
  - https://pypi.anaconda.org/sunpy/simple
  - https://pypi.anaconda.org/liberfa/simple

dashboard_title: Sunpy ecosystem integration matrix

columns:
  - {python: "3.12", variant: stable}
  - {python: "3.12", variant: pre}
  - {python: "3.12", variant: dev}
  - {python: "3.14", variant: stable}
  - {python: "3.14", variant: pre}
  - {python: "3.14", variant: dev}

packages:
  - pypi_name: sunpy
    tier: coordinated
    module: sunpy
    repo_url: https://github.com/sunpy/sunpy.git
    install_extras: [tests, all]
    # sunpy's own pytest config requires plugins that are not installed here.
    pytest_args: ["-c", "sunpy_pytest.ini"]

  - pypi_name: ndcube
    tier: coordinated
    module: ndcube
    repo_url: https://github.com/sunpy/ndcube.git
    install_extras: [tests]

  - pypi_name: drms
    tier: coordinated
    module: drms
    repo_url: https://github.com/sunpy/drms.git
    install_extras: [tests]

  - pypi_name: sunkit-image
    tier: coordinated
    module: sunkit_image
    repo_url: https://github.com/sunpy/sunkit-image.git
    install_extras: [tests]

  - pypi_name: sunraster
    tier: coordinated
    module: sunraster
    repo_url: https://github.com/sunpy/sunraster.git
    install_extras: [tests]

  - pypi_name: sunkit-instruments
    tier: coordinated
    module: sunkit_instruments
    repo_url: https://github.com/sunpy/sunkit-instruments.git
    install_extras: [tests]

  - pypi_name: sunkit-magex
    tier: coordinated
    module: sunkit_magex
    repo_url: https://github.com/sunpy/sunkit-magex.git
    install_extras: [tests]
    
  - pypi_name: aiapy
    tier: affiliated
    module: aiapy
    repo_url: https://github.com/LM-SAL/aiapy.git
    install_extras: [tests]
    
  - pypi_name: roentgen
    tier: affiliated
    module: roentgen
    repo_url: https://github.com/ehsteve/roentgen
    install_extras: [tests]
    
  - pypi_name: solarmach
    tier: affiliated
    module: solarmach
    repo_url: https://github.com/jgieseler/solarmach
    install_extras: [tests]
    
  - pypi_name: dkist
    tier: affiliated
    module: dkist
    repo_url: https://github.com/dkistdc/dkist.git
    install_extras: [tests]

  - pypi_name: xrtpy
    tier: affiliated
    module: xrtpy
    repo_url: https://github.com/HinodeXRT/xrtpy
    install_extras: [tests]
    
  - pypi_name: irispy-lmsal
    tier: affiliated
    module: irispy
    repo_url: https://github.com/LM-SAL/irispy
    install_extras: [tests]
    
  - pypi_name: scope-emd
    tier: affiliated
    module: scope
    repo_url: https://github.com/Warwick-Solar/scope
    install_extras: [tests]
    
  - pypi_name: spectroflat
    tier: affiliated
    module: spectroflat
    repo_url: https://gitlab.gwdg.de/hoelken/spectroflat
    
  - pypi_name: sunkit-spex
    tier: provisional
    module: sunkit_spex
    repo_url: https://github.com/sunpy/sunkit-spex.git
    install_extras: [tests,legacy]

  - pypi_name: pyflct
    tier: provisional
    module: pyflct
    repo_url: https://github.com/sunpy/pyflct.git
    install_extras: [tests]

  - pypi_name: radiospectra
    tier: provisional
    module: radiospectra
    repo_url: https://github.com/sunpy/radiospectra.git
    install_extras: [tests]
