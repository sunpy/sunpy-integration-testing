# Configuration for `sunpy-integration run`.
#
# `core_package` is the ecosystem's core package. The runner builds a
# shared venv, installs the core package first, then installs each
# entry under `packages` in turn (skipping any the resolver can't
# satisfy alongside the existing set), then runs `pytest --pyargs
# <module>` for each one that installed. Point this file at a
# different core package to test a different ecosystem.
#
# `columns` is the flat list of test configurations to run; each is a
# (python, variant) pair and becomes one dashboard column. Python
# version and variant are independent -- list whatever combinations
# you want. Use uv's notation for Python, so e.g. "3.14t" for the
# free-threaded build. Variants:
#   stable -- core package + each package at their latest non-pre-release on PyPI
#   pre    -- same, but latest including pre-releases
#   dev    -- core package from its nightly wheels (or git HEAD if
#             `dev_index_urls` is unset); each package from git HEAD
#
# `tier` (on each package) is purely a category label used for
# ordering and the optional `--tiers` CLI filter. Conventions:
# `coordinated` for the official coordinated set, `affiliated` for
# affiliated packages from the frozen pre-APE 22 registry, `pyopensci`
# for affiliated packages reviewed through the pyOpenSci process,
# `other` for anything else worth testing.

core_package:
  pypi_name: sunpy
  module: sunpy
  repo_url: https://github.com/sunpy/sunpy.git
  # For the `dev` variant the core package is installed from these
  # nightly wheel indexes (liberfa hosts pyerfa's dev wheels). Omit
  # `dev_index_urls` to install the dev version from `git+repo_url`.
  dev_index_urls:
    - https://pypi.anaconda.org/sunpy/simple
    - https://pypi.anaconda.org/liberfa/simple

dashboard_title: Sunpy ecosystem integration matrix

columns:
  - {python: "3.12", variant: stable}
  - {python: "3.12", variant: pre}
  - {python: "3.12", variant: dev}
  - {python: "3.14", variant: stable}
  - {python: "3.14", variant: pre}
  - {python: "3.14", variant: dev}

packages:
  - pypi_name: ndcube
    tier: coordinated
    module: ndcube
    repo_url: https://github.com/sunpy/ndcube.git
    install_extras: [tests]

  - pypi_name: drms
    tier: coordinated
    module: drms
    repo_url: https://github.com/sunpy/drms.git
    install_extras: [tests]

  - pypi_name: sunkit-image
    tier: coordinated
    module: sunkit_image
    repo_url: https://github.com/sunpy/sunkit-image.git
    install_extras: [tests]

  - pypi_name: sunraster
    tier: coordinated
    module: sunraster
    repo_url: https://github.com/sunpy/sunraster.git
    install_extras: [tests]

  - pypi_name: sunkit-instruments
    tier: coordinated
    module: sunkit_instruments
    repo_url: https://github.com/sunpy/sunkit-instruments.git
    install_extras: [tests]

  - pypi_name: sunkit-magex
    tier: coordinated
    module: sunkit_magex
    repo_url: https://github.com/sunpy/sunkit-magex.git
    install_extras: [tests]
    
  - pypi_name: aiapy
    tier: affiliated
    module: aiapy
    repo_url: https://github.com/LM-SAL/aiapy.git
    install_extras: [tests]
    
  - pypi_name: roentgen
    tier: affiliated
    module: roentgen
    repo_url: https://github.com/ehsteve/roentgen
    install_extras: [tests]
    
  - pypi_name: solarmach
    tier: affiliated
    module: solarmach
    repo_url: https://github.com/jgieseler/solarmach
    install_extras: [tests]
    
  - pypi_name: dkist
    tier: affiliated
    module: dkist
    repo_url: https://github.com/dkistdc/dkist.git
    install_extras: [tests]

  - pypi_name: xrtpy
    tier: affiliated
    module: xrtpy
    repo_url: https://github.com/HinodeXRT/xrtpy
    install_extras: [tests]
    
  - pypi_name: irispy-lmsal
    tier: affiliated
    module: irispy
    repo_url: https://github.com/LM-SAL/irispy
    install_extras: [tests]
    
  - pypi_name: scope-emd
    tier: affiliated
    module: scope
    repo_url: https://github.com/Warwick-Solar/scope
    install_extras: [tests]
    
  - pypi_name: spectroflat
    tier: affiliated
    module: spectroflat
    repo_url: https://gitlab.gwdg.de/hoelken/spectroflat
    
  - pypi_name: sunkit-spex
    tier: provisional
    module: sunkit_spex
    repo_url: https://github.com/sunpy/sunkit-spex.git
    install_extras: [tests,legacy]

  - pypi_name: pyflct
    tier: provisional
    module: pyflct
    repo_url: https://github.com/sunpy/pyflct.git
    install_extras: [tests]

  - pypi_name: radiospectra
